<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D1030">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="color-scheme" content="dark light">

  <title>مغامرة الحاسوب | Computer Adventure</title>
  <meta name="description" content="لعبة تعليمية تفاعلية لتعلّم أساسيات الحاسوب والتقنية للأعمار من 10 إلى 18 سنة">

  <meta property="og:title" content="مغامرة الحاسوب">
  <meta property="og:description" content="رحلة تفاعلية ممتعة لتعلّم أساسيات الحاسوب والتقنية">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<svg class="circuit-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g stroke="#5C63C4" stroke-width="1.4" fill="none">
    <path d="M0 120 H180 L220 160 H420 L460 120 H700"/>
    <path d="M0 400 H120 L160 440 H360 V560 L400 600 H620 L660 560 H900"/>
    <path d="M1200 200 H1000 L960 240 H760"/>
    <path d="M1200 620 H980 L940 580 H700 L660 620 H520"/>
    <path d="M300 0 V80 L340 120"/>
    <path d="M900 800 V700 L860 660"/>
  </g>
  <g fill="#5C63C4">
    <circle cx="180" cy="120" r="4"/><circle cx="420" cy="160" r="4"/>
    <circle cx="460" cy="120" r="4"/><circle cx="360" cy="440" r="4"/>
    <circle cx="400" cy="600" r="4"/><circle cx="620" cy="600" r="4"/>
    <circle cx="1000" cy="200" r="4"/><circle cx="760" cy="240" r="4"/>
    <circle cx="980" cy="620" r="4"/><circle cx="520" cy="620" r="4"/>
  </g>
</svg>

<div class="app">

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn hidden" id="backBtn" type="button" data-i18n-aria="ui.back" aria-label="رجوع">
        <span aria-hidden="true" id="backArrow">→</span>
      </button>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">💻</div>
        <div class="brand-text">
          <b data-i18n="ui.brandName">مغامرة الحاسوب</b>
          <span data-i18n="ui.brandTagline">رحلة تعلّم أساسيات التقنية</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="langBtn" type="button" data-i18n-aria="ui.changeLang" aria-label="تغيير اللغة" title="🌐">🌐</button>
      <button class="icon-btn" id="helpBtn" type="button" data-i18n-aria="ui.help" aria-label="مساعدة">❓</button>
      <div class="player-chip" id="playerChip">
        <div class="player-avatar-sm" id="chipAvatar">🙂</div>
        <div class="player-meta">
          <b id="chipName">—</b>
          <span class="stars-total">⭐ <span id="chipStars">0</span> <span data-i18n="ui.points">نقطة</span></span>
        </div>
      </div>
    </div>
  </header>

  <main>

    <section class="screen" id="screen-language" aria-labelledby="langTitle">
      <div class="card lang-card">
        <h1 class="lang-title" id="langTitle">اختر لغتك · Choose your language</h1>
        <p class="lang-sub">Choose your language · اختر اللغة للمتابعة</p>
        <div class="lang-grid">
          <button class="lang-card-btn" data-lang="ar" type="button">
            <span class="lang-flag">🇸🇦</span><b>العربية</b><small>Arabic</small>
          </button>
          <button class="lang-card-btn" data-lang="en" type="button">
            <span class="lang-flag">EN</span><b>English</b><small>English</small>
          </button>
        </div>
        <p class="lang-footnote">🔒 بياناتك محفوظة محليًا فقط</p>
      </div>
    </section>

    <section class="screen hidden" id="screen-about" aria-labelledby="aboutTitle">
      <div class="card about-card">
        <span class="eyebrow" data-i18n="about.eyebrow">🎮 لعبة تعليمية تفاعلية</span>
        <h2 class="about-title" id="aboutTitle" data-i18n="about.title">مرحبًا بك!</h2>
        <p class="about-p" data-i18n="about.intro"></p>
        <div class="age-badge">
          <span class="age-icon">🎂</span>
          <div>
            <b data-i18n="about.ageTitle">الفئة العمرية: 10 – 18 سنة</b>
            <small data-i18n="about.ageSub"></small>
          </div>
        </div>
        <div class="about-features">
          <div class="feature-box"><span class="fb-icon">🧩</span><b data-i18n="about.f1Title"></b><small data-i18n="about.f1Text"></small></div>
          <div class="feature-box"><span class="fb-icon">🏅</span><b data-i18n="about.f2Title"></b><small data-i18n="about.f2Text"></small></div>
          <div class="feature-box"><span class="fb-icon">🎓</span><b data-i18n="about.f3Title"></b><small data-i18n="about.f3Text"></small></div>
        </div>
        <h3 class="about-how" data-i18n="about.howTitle"></h3>
        <ol class="about-steps">
          <li data-i18n="about.step1"></li>
          <li data-i18n="about.step2"></li>
          <li data-i18n="about.step3"></li>
          <li data-i18n="about.step4"></li>
          <li data-i18n="about.step5"></li>
        </ol>
        <button class="btn btn-primary btn-block" id="aboutContinueBtn" type="button" data-i18n="about.cta"></button>
      </div>
    </section>

    <section class="screen hidden" id="screen-setup" aria-labelledby="setupTitle">
      <div class="card">
        <h2 class="setup-title" id="setupTitle" data-i18n="setup.title"></h2>
        <p class="setup-sub" data-i18n="setup.subtitle"></p>
        <label class="field-label" for="playerName" data-i18n="setup.nameLabel"></label>
        <input type="text" id="playerName" maxlength="20" autocomplete="off" spellcheck="false" data-i18n-placeholder="setup.namePlaceholder">
        <div class="field-error" id="nameError" role="alert" aria-live="polite"></div>
        <label class="field-label field-label--spaced" data-i18n="setup.avatarLabel"></label>
        <div class="avatar-grid" id="avatarGrid" role="radiogroup"></div>
        <button class="btn btn-primary btn-block" id="setupContinueBtn" type="button" data-i18n="setup.cta"></button>
      </div>
    </section>

    <section class="screen hidden" id="screen-map" aria-labelledby="mapTitle">
      <div class="card">
        <div class="map-head">
          <h2 class="map-title" id="mapTitle" data-i18n="map.title"></h2>
          <div class="map-progress-wrap">
            <span id="mapProgressLabel">0 / 5</span>
            <div class="map-progress-bar" aria-hidden="true">
              <div class="map-progress-fill" id="mapProgressFill"></div>
            </div>
          </div>
        </div>
        <p class="map-sub">
          <span data-i18n="map.subtitle"></span>
          <span class="map-stars" id="mapStarsLabel">⭐ 0</span>
        </p>
        <div class="level-nodes" id="levelNodes"></div>
      </div>
    </section>

    <section class="screen hidden" id="screen-quiz" aria-labelledby="questionText">
      <div class="card">
        <div class="quiz-top">
          <span class="quiz-level-tag" id="quizLevelTag">—</span>
          <div class="quiz-progress" id="quizProgress" aria-hidden="true"></div>
        </div>
        <div class="quiz-question-label" id="quizQuestionLabel"></div>
        <h3 class="question-text" id="questionText"></h3>
        <div class="options-grid" id="optionsGrid" role="radiogroup"></div>
        <div class="feedback-box" id="feedbackBox" role="status" aria-live="polite">
          <span id="feedbackIcon" aria-hidden="true">✅</span>
          <span id="feedbackText"></span>
        </div>
        <div class="quiz-actions">
          <button class="btn btn-primary" id="nextQBtn" type="button" disabled data-i18n="quiz.next"></button>
        </div>
      </div>
    </section>

    <section class="screen hidden" id="screen-result" aria-labelledby="resultTitle">
      <div class="card result-card">
        <div class="eyebrow" id="resultBadge">🎉</div>
        <h2 class="result-title" id="resultTitle"></h2>
        <div class="result-stars" id="resultStars" aria-hidden="true">
          <span>⭐</span><span>⭐</span><span>⭐</span>
        </div>
        <p class="result-score" id="resultScore"></p>
        <div class="prayer-actions">
          <button class="btn btn-ghost" id="resultMapBtn" type="button" data-i18n="result.mapBtn"></button>
          <button class="btn btn-primary" id="resultNextBtn" type="button">—</button>
        </div>
      </div>
    </section>

    <section class="screen hidden" id="screen-certificate">
      <div class="cert-wrap">
        <div class="certificate" id="certificate">
          <div class="cert-seal" aria-hidden="true">🏆</div>
          <div class="cert-kicker" data-i18n="certificate.kicker"></div>
          <h2 class="cert-title" data-i18n="certificate.title"></h2>
          <div class="cert-name" id="certName">—</div>
          <p class="cert-body" id="certMessage"></p>
          <div class="cert-stats">
            <div class="cert-stat"><b id="certStars">0</b><span data-i18n="certificate.stars"></span></div>
            <div class="cert-stat"><b id="certScore">0%</b><span data-i18n="certificate.score"></span></div>
            <div class="cert-stat"><b id="certLevel">—</b><span data-i18n="certificate.title2"></span></div>
          </div>
          <div class="cert-actions">
            <button class="btn btn-ghost" id="printCertBtn" type="button" data-i18n="certificate.print"></button>
            <button class="btn btn-gold" id="restartBtn" type="button" data-i18n="certificate.restart"></button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <span data-i18n="ui.footer"></span>
  </footer>
</div>

<div class="modal hidden" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-panel">
    <button class="modal-close" type="button" data-close-modal data-i18n-aria="ui.close" aria-label="إغلاق">✕</button>
    <h2 class="modal-title" id="helpTitle" data-i18n="help.title"></h2>
    <p class="modal-sub" data-i18n="help.subtitle"></p>
    <form id="helpForm" novalidate>
      <label class="field-label" for="helpType" data-i18n="help.typeLabel"></label>
      <select id="helpType" required>
        <option value="bug" data-i18n="help.typeBug"></option>
        <option value="lang" data-i18n="help.typeLang"></option>
        <option value="question" data-i18n="help.typeQuestion"></option>
        <option value="help" data-i18n="help.typeHelp"></option>
        <option value="other" data-i18n="help.typeOther"></option>
      </select>
      <label class="field-label" for="helpMessage" data-i18n="help.msgLabel"></label>
      <textarea id="helpMessage" rows="5" maxlength="1000" required data-i18n-placeholder="help.msgPlaceholder"></textarea>
      <label class="field-label" for="helpEmail" data-i18n="help.emailLabel"></label>
      <input type="email" id="helpEmail" autocomplete="email" maxlength="120" data-i18n-placeholder="help.emailPlaceholder">
      <div class="field-error" id="helpError" role="alert" aria-live="polite"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close-modal data-i18n="help.cancel"></button>
        <button type="submit" class="btn btn-primary" id="helpSendBtn" data-i18n="help.send"></button>
      </div>
    </form>
    <div class="help-thanks hidden" id="helpThanks">
      <div class="thanks-icon">✅</div>
      <p data-i18n="help.thanks"></p>
      <button type="button" class="btn btn-primary" data-close-modal data-i18n="ui.close"></button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n/ar.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/components/prayer.js"></script>
<script src="js/components/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
