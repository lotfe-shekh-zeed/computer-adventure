<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>مغامرة الحاسوب | Computer Adventure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161A48'/%3E%3Crect x='10' y='14' width='44' height='28' rx='4' fill='%2321D6B4'/%3E%3Crect x='16' y='19' width='32' height='18' rx='2' fill='%23161A48'/%3E%3Crect x='24' y='44' width='16' height='4' rx='2' fill='%238467FF'/%3E%3Crect x='18' y='50' width='28' height='3' rx='1.5' fill='%238467FF'/%3E%3Ccircle cx='32' cy='28' r='7' fill='%23F4B740'/%3E%3Cpath d='M28 28l3 3 6-6' stroke='%23161A48' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="description" content="لعبة تعليمية تفاعلية ثنائية اللغة لتعلم أساسيات الحاسوب — Bilingual interactive educational game for computer basics">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700&family=Poppins:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0D1030;
    --navy:#161A48;
    --navy-soft:#232966;
    --card:#FBF9F3;
    --card-2:#F1EEE3;
    --ink:#191C3F;
    --ink-soft:#4A4E77;
    --paper:#F1F0FA;
    --teal:#21D6B4;
    --teal-deep:#0FA98C;
    --violet:#8467FF;
    --gold:#F4B740;
    --gold-deep:#D89420;
    --rose:#FF6B7A;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-lift:0 18px 40px -14px rgba(6,8,30,0.55);
    --ease:cubic-bezier(.22,.9,.32,1);
    --f-display:'Tajawal','Cairo',sans-serif;
    --f-body:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  }

  html.lang-en{
    --f-display:'Poppins','Inter',sans-serif;
    --f-body:'Inter','Segoe UI',Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, #2A3080 0%, transparent 55%),
      radial-gradient(1000px 800px at 110% 10%, #1D2260 0%, transparent 50%),
      linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-deep) 100%);
    color:var(--paper);
    font-family:var(--f-body);
    overflow-x:hidden;
    position:relative;
  }

  .circuit-bg{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.16; }

  a{color:inherit;}
  button{font-family:inherit;}
  h1,h2,h3{font-family:var(--f-display); margin:0;}
  :focus-visible{outline:3px solid var(--teal); outline-offset:3px; border-radius:8px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px clamp(16px,4vw,40px); gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:40px; height:40px; border-radius:12px;
    background:linear-gradient(145deg, var(--teal), var(--violet));
    display:flex; align-items:center; justify-content:center;
    font-size:20px; box-shadow:var(--shadow-lift); flex:none;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text b{font-family:var(--f-display); font-weight:800; font-size:17px;}
  .brand-text span{font-size:11px; color:#B9BEE8; letter-spacing:.3px;}

  .topbar-right{display:flex; align-items:center; gap:10px;}

  .lang-toggle{
    display:none; align-items:center; gap:6px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
    border-radius:999px; padding:6px 6px; cursor:pointer;
  }
  .lang-toggle.show{display:inline-flex;}
  .lang-toggle button{
    border:none; background:transparent; color:#B9BEE8; font-size:12px; font-weight:700;
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:all .18s var(--ease);
    font-family:var(--f-display);
  }
  .lang-toggle button.active{background:linear-gradient(135deg,var(--teal),var(--violet)); color:#fff;}

  .player-chip{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    padding:6px 14px 6px 8px; border-radius:999px;
    backdrop-filter:blur(6px);
    opacity:0; transform:translateY(-6px);
    transition:opacity .4s var(--ease), transform .4s var(--ease);
  }
  .player-chip.show{opacity:1; transform:translateY(0);}
  .player-avatar-sm{
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(145deg, var(--gold), var(--rose));
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .player-meta{display:flex; flex-direction:column; line-height:1.2;}
  .player-meta b{font-size:13px; font-family:var(--f-display);}
  .player-meta .stars-total{font-size:11px; color:var(--gold); display:flex; align-items:center; gap:3px;}

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:10px 16px 40px;}

  .screen{ width:100%; max-width:980px; animation:screenIn .5s var(--ease); }
  @keyframes screenIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .hidden{display:none !important;}

  .card{
    background:var(--card); color:var(--ink); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lift); padding:clamp(22px,4vw,44px); position:relative; overflow:hidden;
  }

  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:700; color:var(--teal-deep);
    background:#E4FBF5; padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; font-weight:700; font-family:var(--f-display);
    border-radius:14px; padding:14px 26px; font-size:16px;
    transition:transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0px) scale(.98);}
  .btn-primary{ background:linear-gradient(135deg, var(--teal), var(--teal-deep)); color:#04231C; box-shadow:0 12px 24px -10px rgba(33,214,180,.55); }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{ background:transparent; color:var(--ink); border:2px solid #DCD8C8; }
  .btn-ghost:hover{border-color:var(--violet); color:var(--violet);}
  .btn-gold{ background:linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#3A2400; box-shadow:0 12px 24px -10px rgba(244,183,64,.6); }
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}

  /* ---------- Language select ---------- */
  .lang-card{text-align:center; max-width:600px; margin:0 auto;}
  .lang-icon{
    width:84px; height:84px; margin:0 auto 18px; border-radius:50%;
    background:linear-gradient(145deg, #E4FBF5, #DCEBFF);
    display:flex; align-items:center; justify-content:center; font-size:38px;
    box-shadow:inset 0 0 0 1px rgba(15,169,140,.2);
  }
  .lang-title{font-size:24px; font-weight:800; color:var(--ink); margin-bottom:6px; font-family:'Tajawal','Poppins',sans-serif;}
  .lang-sub{color:var(--ink-soft); margin-bottom:26px; font-size:14.5px; font-family:'Cairo','Inter',sans-serif;}
  .lang-options{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:520px){ .lang-options{grid-template-columns:1fr;} }
  .lang-opt{
    border:2px solid #E3DFCF; background:#fff; border-radius:18px; padding:22px 16px;
    cursor:pointer; transition:all .18s var(--ease); display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .lang-opt:hover{border-color:var(--teal-deep); transform:translateY(-3px);}
  .lang-opt .flag{font-size:34px;}
  .lang-opt b{font-family:'Tajawal',sans-serif; font-size:16px; color:var(--ink);}
  .lang-opt.en b{font-family:'Poppins',sans-serif;}
  .lang-opt span{font-size:12px; color:var(--ink-soft);}

  /* ---------- Welcome ---------- */
  .welcome-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:34px; align-items:center;}
  @media (max-width:760px){ .welcome-grid{grid-template-columns:1fr;} }
  .welcome-title{font-size:clamp(28px,4vw,42px); font-weight:900; line-height:1.25; color:var(--ink);}
  .welcome-title em{font-style:normal; color:var(--teal-deep);}
  .welcome-sub{color:var(--ink-soft); font-size:16px; line-height:1.9; margin:14px 0 26px;}
  .feature-list{list-style:none; padding:0; margin:0 0 28px; display:grid; gap:10px;}
  .feature-list li{display:flex; align-items:center; gap:10px; font-size:14.5px; color:var(--ink);}
  .feature-dot{width:26px; height:26px; border-radius:8px; background:var(--card-2); display:flex; align-items:center; justify-content:center; font-size:14px; flex:none;}

  .hero-art{
    position:relative; aspect-ratio:1/1; border-radius:24px;
    background:linear-gradient(160deg, var(--navy-soft), var(--navy));
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .hero-art svg{width:78%; height:78%;}
  .orbit-badge{
    position:absolute; background:var(--card); color:var(--ink); border-radius:14px;
    padding:8px 12px; font-size:12px; font-weight:700; box-shadow:var(--shadow-lift);
    display:flex; align-items:center; gap:6px; font-family:var(--f-display);
  }
  .orbit-badge.b1{top:8%; inset-inline-end:6%; animation:float1 6s ease-in-out infinite;}
  .orbit-badge.b2{bottom:10%; inset-inline-start:4%; animation:float2 7s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

  /* ---------- Prayer screen ---------- */
  .prayer-card{text-align:center; max-width:640px; margin:0 auto;}
  .prayer-icon{
    width:84px; height:84px; margin:0 auto 18px; border-radius:50%;
    background:linear-gradient(145deg, #FFF6E0, #FCE9BE);
    display:flex; align-items:center; justify-content:center; font-size:40px;
    box-shadow:inset 0 0 0 1px rgba(216,148,32,.25);
  }
  .prayer-title{font-size:24px; font-weight:800; color:var(--ink); margin-bottom:10px;}
  .prayer-text{color:var(--ink-soft); line-height:2; font-size:15.5px; margin-bottom:24px;}
  .prayer-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

  /* ---------- Setup ---------- */
  .setup-title{font-size:24px; font-weight:800; color:var(--ink); margin-bottom:6px;}
  .setup-sub{color:var(--ink-soft); margin-bottom:22px; font-size:14.5px;}
  label.field-label{display:block; font-weight:700; font-size:14px; color:var(--ink); margin-bottom:8px; font-family:var(--f-display);}
  input#playerName, input#playerAge{
    width:100%; padding:14px 16px; border-radius:14px; border:2px solid #E3DFCF;
    font-size:16px; font-family:var(--f-body); color:var(--ink); background:#fff;
    transition:border-color .2s;
  }
  input#playerName:focus, input#playerAge:focus{border-color:var(--teal-deep);}
  input#playerAge{max-width:160px;}
  .field-row{display:flex; gap:20px; flex-wrap:wrap; margin-top:20px;}
  .field-col{flex:1; min-width:180px;}
  .field-col.age-col{flex:0 0 160px;}
  .avatar-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:18px 0 26px;}
  @media (max-width:600px){ .avatar-grid{grid-template-columns:repeat(3,1fr);} }
  .avatar-opt{
    aspect-ratio:1/1; border-radius:16px; border:2px solid #E3DFCF; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer;
    transition:all .18s var(--ease);
  }
  .avatar-opt:hover{border-color:var(--violet); transform:translateY(-2px);}
  .avatar-opt.selected{border-color:var(--teal-deep); background:#E4FBF5; box-shadow:0 0 0 4px rgba(33,214,180,.18);}
  .field-error{color:var(--rose); font-size:13px; margin-top:8px; min-height:16px; font-weight:600;}

  /* ---------- Level map ---------- */
  .map-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:10px;}
  .map-title{font-size:22px; font-weight:800; color:var(--ink);}
  .map-progress-wrap{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft); font-weight:700;}
  .map-progress-bar{width:140px; height:8px; background:#E7E3D4; border-radius:99px; overflow:hidden;}
  .map-progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--violet)); border-radius:99px; transition:width .6s var(--ease);}

  .path-wrap{position:relative; margin-top:26px;}
  .level-nodes{position:relative; display:grid; gap:18px; z-index:1;}

  .level-node{
    display:flex; align-items:center; gap:16px;
    background:#fff; border:2px solid #ECE8D9; border-radius:18px; padding:14px 18px;
    cursor:pointer; transition:all .2s var(--ease); text-align:start;
  }
  .level-node:hover:not(.locked){border-color:var(--teal-deep); transform:translateY(-2px);}
  .level-node.locked{cursor:not-allowed; opacity:.6;}
  .level-node.done{border-color:var(--gold-deep); background:#FFFBF0;}
  .node-icon{
    width:52px; height:52px; border-radius:14px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    background:var(--card-2);
  }
  .level-node.done .node-icon{background:linear-gradient(145deg,var(--gold),var(--gold-deep));}
  .node-info{flex:1; min-width:0;}
  .node-info b{font-family:var(--f-display); font-size:15.5px; color:var(--ink); display:block;}
  .node-info span{font-size:12.5px; color:var(--ink-soft);}
  .node-stars{display:flex; gap:2px; font-size:15px; flex:none;}
  .node-lock{font-size:20px; flex:none; color:#B9B4A0;}

  /* ---------- Quiz ---------- */
  .quiz-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .quiz-level-tag{font-size:13px; font-weight:700; color:var(--violet); font-family:var(--f-display);}
  .quiz-progress{display:flex; gap:6px;}
  .quiz-dot{width:22px; height:6px; border-radius:99px; background:#E7E3D4;}
  .quiz-dot.done{background:var(--teal);}
  .quiz-dot.active{background:var(--violet);}

  .question-text{font-size:clamp(18px,2.4vw,22px); font-weight:800; color:var(--ink); line-height:1.7; margin-bottom:22px; font-family:var(--f-display);}
  .options-grid{display:grid; gap:12px;}
  .option-btn{
    display:flex; align-items:center; gap:12px; text-align:start;
    background:#fff; border:2px solid #E3DFCF; border-radius:14px; padding:15px 16px;
    font-size:15.5px; color:var(--ink); cursor:pointer; transition:all .16s var(--ease); font-weight:600;
    font-family:var(--f-body);
  }
  .option-btn:hover:not(:disabled){border-color:var(--violet);}
  .option-letter{
    width:30px; height:30px; border-radius:9px; background:var(--card-2); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; font-family:var(--f-display);
  }
  .option-btn.correct{border-color:var(--teal-deep); background:#E4FBF5;}
  .option-btn.correct .option-letter{background:var(--teal); color:#04231C;}
  .option-btn.wrong{border-color:var(--rose); background:#FFEFF0;}
  .option-btn.wrong .option-letter{background:var(--rose); color:#fff;}
  .option-btn:disabled{cursor:default;}

  .feedback-box{
    margin-top:18px; padding:14px 16px; border-radius:14px; font-size:14.5px; font-weight:600;
    display:none; align-items:flex-start; gap:10px; line-height:1.8;
  }
  .feedback-box.show{display:flex;}
  .feedback-box.good{background:#E4FBF5; color:#0B5C4B;}
  .feedback-box.bad{background:#FFF1E9; color:#7A3B12;}

  .quiz-actions{display:flex; justify-content:flex-end; margin-top:22px;}

  /* ---------- Level result ---------- */
  .result-card{text-align:center; max-width:560px; margin:0 auto;}
  .result-stars{display:flex; justify-content:center; gap:10px; margin:18px 0 10px; font-size:44px;}
  .result-stars span{opacity:.25; transition:all .35s var(--ease); transform:scale(.7);}
  .result-stars span.earned{opacity:1; transform:scale(1);}
  .result-score{font-size:15px; color:var(--ink-soft); margin-bottom:26px;}
  .result-title{font-size:22px; font-weight:800; color:var(--ink); margin-bottom:6px;}

  /* ---------- Certificate ---------- */
  .cert-wrap{max-width:760px; margin:0 auto;}
  .certificate{
    border:3px solid var(--gold-deep); border-radius:22px; padding:clamp(24px,5vw,50px);
    background:
      radial-gradient(circle at 15% 15%, rgba(244,183,64,.14), transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(132,103,255,.12), transparent 45%),
      #fff;
    text-align:center; position:relative;
  }
  .cert-seal{font-size:52px; margin-bottom:6px;}
  .cert-kicker{font-size:13px; letter-spacing:1px; color:var(--gold-deep); font-weight:800; font-family:var(--f-display);}
  .cert-title{font-size:clamp(24px,4vw,32px); font-weight:900; color:var(--ink); margin:8px 0 4px;}
  .cert-name{font-size:clamp(22px,4vw,30px); font-weight:900; color:var(--teal-deep); margin:14px 0; font-family:var(--f-display);}
  .cert-body{color:var(--ink-soft); font-size:15px; line-height:2; max-width:520px; margin:0 auto 20px;}
  .cert-stats{display:flex; justify-content:center; gap:26px; margin:20px 0; flex-wrap:wrap;}
  .cert-stat b{display:block; font-size:22px; color:var(--ink); font-family:var(--f-display);}
  .cert-stat span{font-size:12px; color:var(--ink-soft);}
  .cert-actions{display:flex; gap:12px; justify-content:center; margin-top:26px; flex-wrap:wrap;}
  .cert-credit{margin-top:22px; font-size:11.5px; color:#B9B4A0; letter-spacing:.2px;}

  footer{text-align:center; padding:16px; font-size:12px; color:#8C90C4;}
  footer .credit{color:#A7ACDE; font-weight:600;}

  @media print{
    .topbar, footer, .cert-actions{display:none !important;}
    body{background:#fff !important;}
    .screen:not(#screen-certificate){display:none !important;}
    .certificate{box-shadow:none;}
  }
</style>
</head>
<body>

<svg class="circuit-bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#5C63C4" stroke-width="1.4" fill="none">
    <path d="M0 120 H180 L220 160 H420 L460 120 H700"/>
    <path d="M0 400 H120 L160 440 H360 V560 L400 600 H620 L660 560 H900"/>
    <path d="M1200 200 H1000 L960 240 H760"/>
    <path d="M1200 620 H980 L940 580 H700 L660 620 H520"/>
    <path d="M300 0 V80 L340 120"/>
    <path d="M900 800 V700 L860 660"/>
  </g>
  <g fill="#5C63C4">
    <circle cx="180" cy="120" r="4"/><circle cx="420" cy="160" r="4"/><circle cx="460" cy="120" r="4"/>
    <circle cx="360" cy="440" r="4"/><circle cx="400" cy="600" r="4"/><circle cx="620" cy="600" r="4"/>
    <circle cx="1000" cy="200" r="4"/><circle cx="760" cy="240" r="4"/>
    <circle cx="980" cy="620" r="4"/><circle cx="520" cy="620" r="4"/>
  </g>
</svg>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">💻</div>
      <div class="brand-text">
        <b id="brandName">Computer Adventure</b>
        <span id="brandTag">مغامرة الحاسوب</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang-toggle" id="langToggle">
        <button type="button" data-lang="ar" id="toggleAr">AR</button>
        <button type="button" data-lang="en" id="toggleEn">EN</button>
      </div>
      <div class="player-chip" id="playerChip">
        <div class="player-avatar-sm" id="chipAvatar">🙂</div>
        <div class="player-meta">
          <b id="chipName">—</b>
          <span class="stars-total">⭐ <span id="chipStars">0</span> <span id="chipStarsLabel">points</span> · <span id="chipAge"></span></span>
        </div>
      </div>
    </div>
  </div>

  <main>

    <!-- SCREEN 0: LANGUAGE SELECT -->
    <section class="screen" id="screen-language">
      <div class="card lang-card">

  /* ---------------- State ---------------- */
  var state = {
    lang:null,
    name:"", age:null, avatar:AVATARS[0],
    currentLevel:0, currentQ:0, levelCorrect:0,
    levelStars:{}, levelDone:{},
    totalStars:0, totalCorrect:0,
    totalQuestions:LEVELS.reduce(function(s,l){return s+l.questions.length;},0),
    answeredThisQ:false,
    currentScreen:"screen-language",
    lastResult:null,
    certLogged:false
  };

  /* ---------------- Helpers ---------------- */
  function $(id){ return document.getElementById(id); }
  function T(){ return UI[state.lang || "ar"]; }
  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function sanitizeName(raw){
    var cleaned = raw.replace(/[<>\/"'`]/g, "").trim();
    return cleaned.slice(0,20);
  }

  /* ---------------- Local device storage (resume progress) ----------------
     Saves only to the visitor's own browser. Nothing is sent anywhere. */
  var LOCAL_KEY = "computerAdventureProgress_v1";

  function saveLocalProgress(){
    try{
      var payload = {
        lang: state.lang, name: state.name, age: state.age, avatar: state.avatar,
        levelStars: state.levelStars, levelDone: state.levelDone,
        totalStars: state.totalStars, totalCorrect: state.totalCorrect,
        savedAt: new Date().toISOString()
      };
      window.localStorage.setItem(LOCAL_KEY, JSON.stringify(payload));
    } catch(e){ /* localStorage unavailable - fail silently, never block gameplay */ }
  }

  function loadLocalProgress(){
    try{
      var raw = window.localStorage.getItem(LOCAL_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }

  function clearLocalProgress(){
    try{ window.localStorage.removeItem(LOCAL_KEY); } catch(e){ /* ignore */ }
  }

  function showScreen(id){
    var screens = document.querySelectorAll(".screen");
    for (var i=0;i<screens.length;i++){ screens[i].classList.add("hidden"); }
    $(id).classList.remove("hidden");
    state.currentScreen = id;
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function updateChip(){
    var chip = $("playerChip");
    if (state.name){
      chip.classList.add("show");
      $("chipName").textContent = state.name;
      $("chipAvatar").textContent = state.avatar;
      $("chipStars").textContent = state.totalStars;
      $("chipStarsLabel").textContent = T().pointsLabel;
      $("chipAge").textContent = state.age ? (state.age + " " + T().ageSuffix) : "";
    }
    saveLocalProgress();
  }

  /* ---------------- Language ---------------- */
  function setLanguage(lang){
    state.lang = lang;
    var html = document.documentElement;
    html.setAttribute("lang", lang);
    html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
    html.classList.toggle("lang-en", lang === "en");

    $("langToggle").classList.add("show");
    $("toggleAr").classList.toggle("active", lang === "ar");
    $("toggleEn").classList.toggle("active", lang === "en");

    applyStaticText();
    updateChip();

    // Re-render whatever dynamic screen is currently visible
    if (state.currentScreen === "screen-map"){ renderMap(); }
    else if (state.currentScreen === "screen-quiz"){ renderQuestion(); }
    else if (state.currentScreen === "screen-result" && state.lastResult){ renderResultScreen(state.lastResult); }
    else if (state.currentScreen === "screen-certificate"){ renderCertificate(); }
    else if (state.currentScreen === "screen-setup"){ buildAvatarGrid(); }
    else if (state.currentScreen === "screen-resume"){
      $("resumeTitle").textContent = T().resumeTitle;
      $("resumeText").textContent = T().resumeText(state.name);
      $("resumeContinueBtn").textContent = T().resumeContinueBtn;
      $("resumeNewBtn").textContent = T().resumeNewBtn;
    }
  }

  function applyStaticText(){
    var t = T();
    document.title = state.lang === "ar" ? "مغامرة الحاسوب" : "Computer Adventure";

    $("brandName").textContent = t.brandName;
    $("brandTag").textContent = t.brandTag;

    $("welcomeEyebrow").textContent = t.welcomeEyebrow;
    $("welcomeTitle").innerHTML = t.welcomeTitleHTML;
    $("welcomeSub").textContent = t.welcomeSub;
    var fl = $("featureList"); fl.innerHTML = "";
    t.features.forEach(function(f){
      var parts = f.split(/\s(.+)/);
      var li = document.createElement("li");
      li.innerHTML = '<span class="feature-dot">'+ parts[0] +'</span><span>'+ escapeHTML(parts[1]) +'</span>';
      fl.appendChild(li);
    });
    $("startBtn").textContent = t.startBtn;
    $("badge1").textContent = t.badge1;
    $("badge2").textContent = t.badge2;

    $("setupTitle").textContent = t.setupTitle;
    $("setupSub").textContent = t.setupSub;
    $("nameLabel").textContent = t.nameLabel;
    $("playerName").placeholder = t.namePlaceholder;
    $("ageLabel").textContent = t.ageLabel;
    $("playerAge").placeholder = t.agePlaceholder;
    $("avatarLabel").textContent = t.avatarLabel;
    $("setupContinueBtn").textContent = t.setupContinueBtn;

    $("mapTitle").textContent = t.mapTitle;

    $("printCertBtn").textContent = t.printCertBtn;
    $("restartBtn").textContent = t.restartBtn;
    $("certKicker").textContent = t.certKicker;
    $("certTitle").textContent = t.certTitle;
    $("certStarsLabel").textContent = t.certStarsLabel;
    $("certScoreLabel").textContent = t.certScoreLabel;
    $("certLevelLabel").textContent = t.certLevelLabel;
    $("certAgeLabel").textContent = t.certAgeLabel;
    $("certCredit").textContent = t.certCredit;

    $("siteFooter").innerHTML = escapeHTML(t.footer) + ' · <span class="credit">' + escapeHTML(t.footerCredit) + '</span>';
  }

  $("chooseAr").addEventListener("click", function(){ setLanguage("ar"); showScreen("screen-welcome"); });
  $("chooseEn").addEventListener("click", function(){ setLanguage("en"); showScreen("screen-welcome"); });
  $("toggleAr").addEventListener("click", function(){ setLanguage("ar"); });
  $("toggleEn").addEventListener("click", function(){ setLanguage("en"); });

  /* ---------------- Avatar grid ---------------- */
  function buildAvatarGrid(){
    var grid = $("avatarGrid");
    var previouslySelected = state.avatar;
    grid.innerHTML = "";
    AVATARS.forEach(function(av){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "avatar-opt" + (av === previouslySelected ? " selected" : "");
      btn.textContent = av;
      btn.setAttribute("aria-label", (state.lang === "en" ? "Choose character " : "اختيار الشخصية ") + av);
      btn.addEventListener("click", function(){
        var all = grid.querySelectorAll(".avatar-opt");
        all.forEach(function(b){ b.classList.remove("selected"); });
        btn.classList.add("selected");
        state.avatar = av;
      });
      grid.appendChild(btn);
    });
  }

  /* ---------------- Level map ---------------- */
  function renderMap(){
    var t = T();
    var wrap = $("levelNodes");
    wrap.innerHTML = "";
    var doneCount = 0;

    LEVELS.forEach(function(level, idx){
      var isDone = !!state.levelDone[level.id];
      var isLocked = idx > 0 && !state.levelDone[LEVELS[idx-1].id];
      if (isDone) doneCount++;

      var node = document.createElement("div");
      node.className = "level-node" + (isLocked ? " locked" : "") + (isDone ? " done" : "");
      node.setAttribute("role","button");
      node.setAttribute("tabindex", isLocked ? "-1" : "0");

      var starsHtml = "";
      var stars = state.levelStars[level.id] || 0;
      for (var s=1;s<=3;s++){ starsHtml += (s<=stars ? "⭐" : "☆"); }

      var levelWord = state.lang === "en" ? "Level" : "المرحلة";

      node.innerHTML =
        '<div class="node-icon">'+ level.icon +'</div>' +
        '<div class="node-info">' +
          '<b>' + levelWord + ' ' + level.id + ': ' + escapeHTML(level.title[state.lang]) + '</b>' +
          '<span>' + escapeHTML(level.desc[state.lang]) + '</span>' +
        '</div>' +
        (isLocked
          ? '<div class="node-lock">🔒</div>'
          : '<div class="node-stars">'+ starsHtml +'</div>');

      if (!isLocked){
        node.addEventListener("click", function(){ startLevel(level.id); });
        node.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " "){ e.preventDefault(); startLevel(level.id); }
        });
      }
      wrap.appendChild(node);
    });

    $("mapProgressLabel").textContent = t.mapProgress(doneCount, LEVELS.length);
    $("mapProgressFill").style.width = (doneCount / LEVELS.length * 100) + "%";

    if (doneCount === LEVELS.length){
      renderCertificate();
    }
  }

  /* ---------------- Quiz flow ---------------- */
  function startLevel(levelId){
    state.currentLevel = levelId;
    state.currentQ = 0;
    state.levelCorrect = 0;
    renderQuestion();
    showScreen("screen-quiz");
  }

  function getLevel(){
    return LEVELS.find(function(l){ return l.id === state.currentLevel; });
  }

  function renderQuestion(){
    var t = T();
    var level = getLevel();
    if (!level) return;
    var q = level.questions[state.currentQ];
    state.answeredThisQ = false;

    $("quizLevelTag").textContent = t.quizLevelTag(level.id, level.title[state.lang]);

    var progWrap = $("quizProgress");
    progWrap.innerHTML = "";
    level.questions.forEach(function(_, i){
      var dot = document.createElement("span");
      dot.className = "quiz-dot" + (i < state.currentQ ? " done" : (i === state.currentQ ? " active" : ""));
      progWrap.appendChild(dot);
    });

    $("questionText").textContent = q.q[state.lang];

    var optionsGrid = $("optionsGrid");
    optionsGrid.innerHTML = "";
    var letters = t.optionLetters;
    q.options[state.lang].forEach(function(opt, i){
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = '<span class="option-letter">'+ letters[i] +'</span><span>'+ escapeHTML(opt) +'</span>';
      btn.addEventListener("click", function(){ handleAnswer(i, btn); });
      optionsGrid.appendChild(btn);
    });

    $("feedbackBox").classList.remove("show","good","bad");
    $("nextQBtn").disabled = true;
    $("nextQBtn").textContent = (state.currentQ === level.questions.length - 1) ? t.showResultBtn : t.nextBtn;
  }

  function handleAnswer(selectedIdx, btnEl){
    if (state.answeredThisQ) return;
    state.answeredThisQ = true;

    var t = T();
    var level = getLevel();
    var q = level.questions[state.currentQ];
    var allBtns = document.querySelectorAll("#optionsGrid .option-btn");
    allBtns.forEach(function(b){ b.disabled = true; });

    var isCorrect = selectedIdx === q.correct;
    if (isCorrect){
      btnEl.classList.add("correct");
      state.levelCorrect++;
      state.totalCorrect++;
    } else {
      btnEl.classList.add("wrong");
      allBtns[q.correct].classList.add("correct");
    }

    var fb = $("feedbackBox");
    fb.classList.add("show", isCorrect ? "good" : "bad");
    $("feedbackIcon").textContent = isCorrect ? "✅" : "💡";
    $("feedbackText").textContent = (isCorrect ? t.feedbackGood : t.feedbackBad) + q.explain[state.lang];

    $("nextQBtn").disabled = false;
  }

  $("nextQBtn").addEventListener("click", function(){
    var level = getLevel();
    if (state.currentQ < level.questions.length - 1){
      state.currentQ++;
      renderQuestion();
    } else {
      finishLevel();
    }
  });

  function finishLevel(){
    var level = getLevel();
    var total = level.questions.length;
    var correct = state.levelCorrect;
    var stars = correct >= 4 ? 3 : (correct === 3 ? 2 : 1);

    var prevStars = state.levelStars[level.id] || 0;
    if (stars > prevStars){
      state.totalStars += (stars - prevStars);
      state.levelStars[level.id] = stars;
    }
    state.levelDone[level.id] = true;

    state.lastResult = { levelId:level.id, stars:stars, correct:correct, total:total, isLast: !LEVELS.find(function(l){return l.id === level.id+1;}) };
    updateChip();
    renderResultScreen(state.lastResult);
    showScreen("screen-result");
  }

  function renderResultScreen(res){
    var t = T();
    var level = LEVELS.find(function(l){ return l.id === res.levelId; });

    $("resultBadge").textContent = res.stars === 3 ? t.resultBadge3 : (res.stars === 2 ? t.resultBadge2 : t.resultBadge1);
    $("resultTitle").textContent = t.resultTitle(level.title[state.lang]);
    $("resultScore").textContent = t.resultScore(res.correct, res.total);

    var starSpans = document.querySelectorAll("#resultStars span");
    starSpans.forEach(function(s, i){ s.classList.toggle("earned", i < res.stars); });

    $("resultMapBtn").textContent = t.resultMapBtn;
    var nextBtn = $("resultNextBtn");
    if (!res.isLast){
      nextBtn.textContent = t.resultNextBtn;
      var nextLevel = LEVELS.find(function(l){ return l.id === res.levelId + 1; });
      nextBtn.onclick = function(){ startLevel(nextLevel.id); };
    } else {
      nextBtn.textContent = t.resultCertBtn;
      nextBtn.onclick = function(){ renderCertificate(); showScreen("screen-certificate"); };
    }
  }

  $("resultMapBtn").addEventListener("click", function(){
    renderMap();
    showScreen("screen-map");
  });

  /* ---------------- Certificate ---------------- */
  function renderCertificate(){
    var t = T();
    var pct = Math.round((state.totalCorrect / state.totalQuestions) * 100);
    var tier = pct >= 85 ? "high" : (pct >= 60 ? "mid" : "low");
    var titles = APPRECIATION[state.lang][tier];
    var title = titles[Math.floor(Math.random() * titles.length)];

    $("certName").textContent = state.avatar + "  " + state.name;
    $("certStars").textContent = state.totalStars;
    $("certScore").textContent = pct + "%";
    $("certLevel").textContent = title;
    $("certAge").textContent = state.age ? (state.age + " " + t.ageSuffix) : "—";

    var msg = pct >= 85 ? t.certMsgHigh : (pct >= 60 ? t.certMsgMid : t.certMsgLow);
    $("certMessage").textContent = msg;
  }

  $("printCertBtn").addEventListener("click", function(){ window.print(); });

  $("resumeContinueBtn").addEventListener("click", function(){
    renderMap();
    showScreen("screen-map");
  });

  $("resumeNewBtn").addEventListener("click", function(){
    clearLocalProgress();
    state.name = ""; state.age = null; state.avatar = AVATARS[0];
    state.levelStars = {}; state.levelDone = {};
    state.totalStars = 0; state.totalCorrect = 0; state.certLogged = false;
    $("playerChip").classList.remove("show");
    buildAvatarGrid();
    showScreen("screen-setup");
  });

  $("restartBtn").addEventListener("click", function(){
    state.currentLevel = 0;
    state.currentQ = 0;
    state.levelCorrect = 0;
    state.levelStars = {};
    state.levelDone = {};
    state.totalStars = 0;
    state.totalCorrect = 0;
    state.certLogged = false;
    updateChip();
    renderMap();
    showScreen("screen-map");
  });

  /* ---------------- Setup / navigation ---------------- */
  $("startBtn").addEventListener("click", function(){ showScreen("screen-setup"); });

  $("setupContinueBtn").addEventListener("click", function(){
    var t = T();
    var raw = $("playerName").value || "";
    var clean = sanitizeName(raw);
    var nameOk = true, ageOk = true;

    if (!clean){
      $("nameError").textContent = t.nameError;
      nameOk = false;
    } else {
      $("nameError").textContent = "";
    }

    var ageRaw = ($("playerAge").value || "").trim();
    var ageNum = parseInt(ageRaw, 10);
    if (!ageRaw || isNaN(ageNum)){
      $("ageError").textContent = t.ageErrorEmpty;
      ageOk = false;
    } else if (ageNum < 5 || ageNum > 18){
      $("ageError").textContent = t.ageErrorRange;
      ageOk = false;
    } else {
      $("ageError").textContent = "";
    }

    if (!nameOk){ $("playerName").focus(); return; }
    if (!ageOk){ $("playerAge").focus(); return; }

    state.name = clean;
    state.age = ageNum;
    updateChip();
    renderMap();
    showScreen("screen-map");
  });

  $("playerName").addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); $("setupContinueBtn").click(); }
  });

  /* ---------------- Init ---------------- */
  buildAvatarGrid();

  (function initApp(){
    var saved = loadLocalProgress();
    if (saved && saved.name && saved.lang){
      setLanguage(saved.lang);
      state.name = saved.name;
      state.age = saved.age || null;
      state.avatar = saved.avatar || AVATARS[0];
      state.levelStars = saved.levelStars || {};
      state.levelDone = saved.levelDone || {};
      state.totalStars = saved.totalStars || 0;
      state.totalCorrect = saved.totalCorrect || 0;
      buildAvatarGrid();
      updateChip();
      $("resumeTitle").textContent = T().resumeTitle;
      $("resumeText").textContent = T().resumeText(state.name);
      $("resumeContinueBtn").textContent = T().resumeContinueBtn;
      $("resumeNewBtn").textContent = T().resumeNewBtn;
      showScreen("screen-resume");
    } else {
      showScreen("screen-language");
    }
  })();

})();
</script>
</body>
</html>
